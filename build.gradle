plugins {
    id 'com.android.application' version '8.13.0'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.0'
}

// Load shared versions and utilities — must be before android {} and dependencies {}
if (file('_shared/android/common.gradle').exists()) {
    apply from: '_shared/android/common.gradle'
}

def rinDebugKeystore = file('../../toolchain/android-user-home/debug.keystore')

android {
    namespace 'com.geniex.demo'
    ndkVersion '27.3.13750724'
    compileSdk 34

    defaultConfig {
        applicationId 'com.geniex.demo'
        minSdk 31
        targetSdk 34
        versionCode 28
        versionName '1.6.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        debug {
            if (rinDebugKeystore.exists()) {
                storeFile rinDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                enableV1Signing false
                enableV2Signing false
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'TEST_MODEL_SEED', 'false'
            signingConfig signingConfigs.debug
        }
        release {
            buildConfigField 'boolean', 'TEST_MODEL_SEED', 'false'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        jniLibs.useLegacyPackaging = true
        jniLibs.pickFirsts += [
            'lib/arm64-v8a/libQnnHtp.so',
            'lib/arm64-v8a/libQnnHtpNetRunExtensions.so',
            'lib/arm64-v8a/libQnnHtpPrepare.so',
            'lib/arm64-v8a/libQnnHtpProfilingReader.so',
            'lib/arm64-v8a/libQnnHtpV79Stub.so',
            'lib/arm64-v8a/libQnnHtpV79.so',
            'lib/arm64-v8a/libQnnHtpV79Skel.so',
            '**/libQnnHtpV79.so',
            '**/libQnnHtpV79Skel.so',
            'lib/arm64-v8a/libQnnSystem.so',
        ]
        jniLibs.keepDebugSymbols += [
            'lib/arm64-v8a/libQnnHtp.so',
            'lib/arm64-v8a/libQnnHtpNetRunExtensions.so',
            'lib/arm64-v8a/libQnnHtpPrepare.so',
            'lib/arm64-v8a/libQnnHtpProfilingReader.so',
            'lib/arm64-v8a/libQnnHtpV79Stub.so',
            'lib/arm64-v8a/libQnnHtpV79.so',
            'lib/arm64-v8a/libQnnHtpV79Skel.so',
            '**/libQnnHtpV79.so',
            '**/libQnnHtpV79Skel.so',
            'lib/arm64-v8a/libQnnSystem.so',
            'lib/arm64-v8a/librinqnnnetrun.so',
        ]
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            maxParallelForks = 1
            systemProperty 'rin.render.dir', System.getenv('RIN_RENDER_DIR') ?: file('../../toolchain/temp/integration-1.6-ui-review').absolutePath
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'maven.repo.local', 'H:/Rin_Android_NPU_Agent/toolchain/robolectric-maven'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    androidResources {
        noCompress += ['gguf']
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.json:json:20240303'
    // GenieX Android binding (published to Maven Central).
    implementation 'com.qualcomm.qti:geniex-android:0.3.5'

    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // AndroidX core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Material Components (provides the app theme)
    implementation 'com.google.android.material:material:1.12.0'

    // Ed25519 verification for signed model manifests (minSdk 31; framework Ed25519 is API 33+).
    implementation 'com.google.crypto.tink:tink-android:1.23.0'

    // Markwon (Markdown rendering)
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:linkify:4.6.2'
    implementation 'io.noties.markwon:ext-latex:4.6.2'
    implementation 'io.noties.markwon:inline-parser:4.6.2'

    // Status bar (immersionbar, Maven Central)
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'
    implementation 'com.geyifeng.immersionbar:immersionbar-ktx:3.2.2'

    // Testing (instrumented UI Automator tests under src/androidTest)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


// Generated output stays off the nearly-full source drive.
layout.buildDirectory.set(file("../../toolchain/temp/integration-1.6-gradle-build"))

